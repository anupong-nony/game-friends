<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Game Friends - Bingo</title>

    <link
        rel="stylesheet"
        href="bingo.css"
    >

    <style>
        /* =====================================================
           BINGO COUNTDOWN
           ===================================================== */

        #bingoCountdownOverlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: transparent;
        }

        #bingoCountdownOverlay[hidden] {
            display: none;
        }

        .bingo-countdown-number {
            min-width: 120px;
            min-height: 120px;
            padding: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 24, 32, .90);
            border: 2px solid rgba(255,255,255,.18);
            box-shadow:
                0 12px 45px rgba(0,0,0,.55),
                0 0 35px rgba(85,120,216,.18);
            color: #fff;
            font-size: 58px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 3px 15px rgba(0,0,0,.7);
        }

        .bingo-countdown-text {
            position: absolute;
            margin-top: 155px;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(20,24,32,.88);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
        }


        /* =====================================================
           WINNER POPUP
           ===================================================== */

        #winnerModal {
            z-index: 250;
        }

        .winner-modal {
            width: 100%;
            max-width: 360px;
            background: #282d37;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 20px 55px rgba(0,0,0,.6);
            text-align: center;
        }

        .winner-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .winner-name {
            font-size: 18px;
            font-weight: 900;
            color: #ffd45c;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .winner-message {
            color: #c4c9d2;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .winner-prize {
            background: #20242d;
            border-radius: 9px;
            padding: 10px;
            margin-bottom: 14px;
            color: #fff;
            font-size: 12px;
            line-height: 1.7;
        }

        .winner-confirm-btn {
            width: 100%;
            min-height: 38px;
            border: none;
            border-radius: 8px;
            background: #57a773;
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }

        .winner-confirm-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .winner-confirm-status {
            min-height: 18px;
            margin-top: 8px;
            color: #aeb5c2;
            font-size: 10px;
        }

        @media (max-width: 380px) {

            .bingo-countdown-number {
                min-width: 100px;
                min-height: 100px;
                font-size: 48px;
            }

            .bingo-countdown-text {
                margin-top: 130px;
            }

            .winner-modal {
                max-width: 320px;
                padding: 15px;
            }
        }
    </style>

</head>

<body>

    <main class="bingo-app">

        <header class="bingo-header">

            <div class="bingo-title">
                🎯 BINGO
            </div>

            <div class="bingo-status">

                <div>
                    🪙
                    <span id="coinDisplay">0</span>
                </div>

                <button
                    id="playerCountBtn"
                    class="player-count-btn"
                    type="button"
                >
                    👥
                    <span id="playerCount">0/20</span>
                </button>

            </div>

        </header>


        <section class="room-info">

            <div
                id="roomName"
                class="room-name"
            >
                ห้อง Bingo
            </div>

            <div
                id="roomStatus"
                class="room-status"
            >
                รอผู้เล่น
            </div>

            <button
                id="leaveRoomBtn"
                class="leave-room-btn"
                type="button"
            >
                🚪 ออก
            </button>

        </section>


        <section class="latest-draw-section">

            <div class="latest-draw-label">
                เลขล่าสุด
            </div>

            <div
                id="latestDrawNumber"
                class="latest-draw-number"
            >
                -
            </div>

        </section>


        <section class="latest-numbers-section">

            <div class="latest-title">
                5 เลขล่าสุด
            </div>

            <div
                id="latestNumbers"
                class="latest-numbers"
            >
                <span>-</span>
                <span>-</span>
                <span>-</span>
                <span>-</span>
                <span>-</span>
            </div>

        </section>


        <section
            id="boardsContainer"
            class="boards-container"
        ></section>


        <section class="board-controls">

            <div
                id="boardCountText"
                class="board-count-text"
            >
                กระดาน 1/4
            </div>

            <button
                id="buyBoardBtn"
                class="buy-board-btn"
                type="button"
            >
                ➕ ซื้อกระดาน
                <span>20 🪙</span>
            </button>

        </section>


        <section
            id="hostControls"
            class="host-controls"
            hidden
        >

            <div class="host-label">
                👑 เจ้าของห้อง
            </div>

            <div class="host-action-row">

                <button
                    id="startGameBtn"
                    class="start-game-btn"
                    type="button"
                >
                    ▶️ เปิดเกม
                </button>

                <div
                    id="drawResult"
                    class="draw-result"
                >
                    -
                </div>

                <button
                    id="drawNumberBtn"
                    class="draw-number-btn"
                    type="button"
                    disabled
                >
                    🎲 สุ่มเลข
                </button>

            </div>

        </section>


        <section
            id="gameControls"
            class="game-controls"
        >

            <button
                id="readyBtn"
                class="ready-btn"
                type="button"
            >
                พร้อม
            </button>

        </section>


        <section
            id="chatSection"
            class="chat-section"
        >

            <div class="chat-title">
                💬 Chat
                <span class="chat-expand-hint">
                    แตะเพื่อขยาย
                </span>
            </div>

            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="chat-message system-message">
                    <b>ระบบ:</b>
                    ยินดีต้อนรับเข้าสู่ห้อง Bingo
                </div>

            </div>

            <div class="chat-input-row">

                <input
                    id="chatInput"
                    type="text"
                    maxlength="100"
                    placeholder="พิมพ์ข้อความ..."
                >

                <button
                    id="chatSendBtn"
                    type="button"
                >
                    ส่ง
                </button>

            </div>

        </section>

    </main>


    <!-- =====================================================
         COUNTDOWN
         ===================================================== -->

    <div
        id="bingoCountdownOverlay"
        hidden
    >

        <div
            id="bingoCountdownNumber"
            class="bingo-countdown-number"
        >
            60
        </div>

        <div
            id="bingoCountdownText"
            class="bingo-countdown-text"
        >
            เตรียมตัวกดพร้อม
        </div>

    </div>


    <!-- =====================================================
         PLAYER LIST
         ===================================================== -->

    <div
        id="playerModal"
        class="modal-overlay"
        hidden
    >

        <div class="player-modal">

            <div class="modal-header">

                <div>
                    👥 ผู้เล่นในห้อง
                </div>

                <button
                    id="closePlayerModalBtn"
                    class="modal-close-btn"
                    type="button"
                >
                    ✕
                </button>

            </div>

            <div
                id="playerList"
                class="player-list"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         CHAT MODAL
         ===================================================== -->

    <div
        id="chatModal"
        class="modal-overlay"
        hidden
    >

        <div class="chat-modal">

            <div class="chat-modal-header">

                <div>
                    💬 Chat
                </div>

                <button
                    id="closeChatModalBtn"
                    class="modal-close-btn"
                    type="button"
                >
                    ✕
                </button>

            </div>

            <div
                id="expandedChatMessages"
                class="expanded-chat-messages"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         LEAVE ROOM
         ===================================================== -->

    <div
        id="leaveModal"
        class="modal-overlay"
        hidden
    >

        <div class="confirm-modal">

            <div class="confirm-title">
                🚪 ออกจากห้อง
            </div>

            <div class="confirm-message">
                คุณต้องการออกจากห้อง Bingo หรือไม่?
            </div>

            <div class="confirm-buttons">

                <button
                    id="cancelLeaveBtn"
                    class="cancel-btn"
                    type="button"
                >
                    ยกเลิก
                </button>

                <button
                    id="confirmLeaveBtn"
                    class="confirm-leave-btn"
                    type="button"
                >
                    ออกจากห้อง
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         WINNER POPUP
         ===================================================== -->

    <div
        id="winnerModal"
        class="modal-overlay"
        hidden
    >

        <div class="winner-modal">

            <div class="winner-title">
                🎉 BINGO!
            </div>

            <div
                id="winnerName"
                class="winner-name"
            >
                -
            </div>

            <div
                id="winnerMessage"
                class="winner-message"
            >
                ชนะเกม Bingo
            </div>

            <div
                id="winnerPrize"
                class="winner-prize"
            >
                กำลังคำนวณรางวัล...
            </div>

            <button
                id="winnerConfirmBtn"
                class="winner-confirm-btn"
                type="button"
            >
                ตกลง
            </button>

            <div
                id="winnerConfirmStatus"
                class="winner-confirm-status"
            ></div>

        </div>

    </div>


    <script
        type="module"
        src="bingo.js"
    ></script>

</body>

</html>
