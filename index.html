<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <h1>🎮 Friend Games</h1>
        <p class="subtitle">เกมสนุก ๆ สำหรับเล่นกับเพื่อน</p>

        <div class="login-box">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="loginBtn">เข้าสู่ระบบ</button>

            <button id="registerBtn" class="register-btn">
                สมัครสมาชิก
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
