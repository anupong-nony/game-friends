<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Game Friends - Bingo</title>

    <link
        rel="stylesheet"
        href="bingo.css"
    >

</head>

<body>

    <main class="bingo-app">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="bingo-header">

            <div class="bingo-title">
                🎯 BINGO
            </div>

            <div class="bingo-status">

                <div>
                    🪙
                    <span id="coinDisplay">
                        100
                    </span>
                </div>

                <button
                    id="playerCountBtn"
                    class="player-count-btn"
                    type="button"
                >
                    👥
                    <span id="playerCount">
                        1/20
                    </span>
                </button>

            </div>

        </header>


        <!-- =================================================
             ROOM
        ================================================== -->

        <section class="room-info">

            <div class="room-name">
                ห้อง Bingo
            </div>

            <div class="room-status">
                รอเริ่มเกม
            </div>

            <button
                id="leaveRoomBtn"
                class="leave-room-btn"
                type="button"
            >
                🚪 ออก
            </button>

        </section>


        <!-- =================================================
             LATEST NUMBERS
        ================================================== -->

        <section class="latest-numbers-section">

            <div class="latest-title">
                เลขล่าสุด
            </div>

            <div
                id="latestNumbers"
                class="latest-numbers"
            >

                <span>-</span>
                <span>-</span>
                <span>-</span>
                <span>-</span>
                <span>-</span>

            </div>

        </section>


        <!-- =================================================
             BOARD AREA
        ================================================== -->

        <section
            id="boardsContainer"
            class="boards-container"
        >
        </section>


        <!-- =================================================
             BOARD CONTROLS
        ================================================== -->

        <section class="board-controls">

            <div
                id="boardCountText"
                class="board-count-text"
            >
                กระดาน 1/4
            </div>

            <button
                id="buyBoardBtn"
                class="buy-board-btn"
                type="button"
            >
                ➕ ซื้อกระดาน
                <span>
                    20 🪙
                </span>
            </button>

        </section>


        <!-- =================================================
             HOST CONTROLS
        ================================================== -->

        <section
            id="hostControls"
            class="host-controls"
        >

            <div class="host-label">
                👑 เจ้าของห้อง
            </div>

            <button
                id="drawNumberBtn"
                class="draw-number-btn"
                type="button"
            >
                🎲 สุ่มเลข
            </button>

            <div
                id="drawResult"
                class="draw-result"
            >
                -
            </div>

        </section>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section class="chat-section">

            <div class="chat-title">
                💬 Chat
            </div>

            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="chat-message system-message">
                    <b>ระบบ:</b>
                    ยินดีต้อนรับเข้าสู่ห้อง Bingo
                </div>

            </div>

            <div class="chat-input-row">

                <input
                    id="chatInput"
                    type="text"
                    maxlength="100"
                    placeholder="พิมพ์ข้อความ..."
                >

                <button
                    id="chatSendBtn"
                    type="button"
                >
                    ส่ง
                </button>

            </div>

        </section>


        <!-- =================================================
             GAME BUTTON
        ================================================== -->

        <section
            id="gameControls"
            class="game-controls"
        >

            <button
                id="readyBtn"
                class="ready-btn"
                type="button"
            >
                พร้อม
            </button>

        </section>

    </main>


    <!-- =================================================
         PLAYER LIST MODAL
    ================================================== -->

    <div
        id="playerModal"
        class="modal-overlay"
        hidden
    >

        <div class="player-modal">

            <div class="modal-header">

                <div>
                    👥 ผู้เล่นในห้อง
                </div>

                <button
                    id="closePlayerModalBtn"
                    class="modal-close-btn"
                    type="button"
                >
                    ✕
                </button>

            </div>

            <div
                id="playerList"
                class="player-list"
            >
            </div>

        </div>

    </div>


    <!-- =================================================
         LEAVE ROOM MODAL
    ================================================== -->

    <div
        id="leaveModal"
        class="modal-overlay"
        hidden
    >

        <div class="confirm-modal">

            <div class="confirm-title">
                🚪 ออกจากห้อง
            </div>

            <div class="confirm-message">
                คุณต้องการออกจากห้อง Bingo หรือไม่?
            </div>

            <div class="confirm-buttons">

                <button
                    id="cancelLeaveBtn"
                    class="cancel-btn"
                    type="button"
                >
                    ยกเลิก
                </button>

                <button
                    id="confirmLeaveBtn"
                    class="confirm-leave-btn"
                    type="button"
                >
                    ออกจากห้อง
                </button>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="bingo.js"
    ></script>

</body>

</html>
